<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan 2027 Fares</title>
<meta name="description" content="Japan 2027 flight price tracker: CCU / BOM / DEL to Japan">
<meta name="theme-color" content="#0d366b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <div>
        <div class="title">Japan 2027</div>
        <div class="sub" id="status">Loading…</div>
      </div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Refresh">⟳</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" class="on"><span class="ti">★</span>Home</button>
    <button role="tab" data-tab="calendar"><span class="ti">▦</span>Calendar</button>
    <button role="tab" data-tab="history"><span class="ti">↘</span>History</button>
    <button role="tab" data-tab="logs"><span class="ti">≡</span>Logs</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div id="tip" class="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
